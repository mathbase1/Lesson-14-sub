ion":[["NEXT TO A LETTER MEANS ×","<div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><mi>x</mi><mo>=</mo><mn>3</mn><mo>×</mo><mi>x</mi></mrow></math></div><div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mi>b</mi><mo>=</mo><mi>a</mi><mo>×</mo><mi>b</mi></mrow></math></div><p>Use an explicit × when replacing letters with numbers.</p>"],["A POWER BELONGS TO ITS BASE","<div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mo>×</mo><mi>x</mi><mo>×</mo><mi>x</mi></mrow></math></div><p>Only <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x</mi></mrow></math> is squared.<br>This is not <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo>(</mo><mn>2</mn><mi>x</mi><mo>)</mo></mrow><mn>2</mn></msup></mrow></math>.</p>"],["BRACKETS KEEP A GROUP TOGETHER","<div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>)</mo></mrow><mo>=</mo><mn>2</mn><mo>×</mo><mrow><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>)</mo></mrow></mrow></math></div><p>Work inside the brackets first.<br>There is no need to expand before substituting.</p>"]],"bidmas":[["1 · BRACKETS","<p>Calculate inside grouping symbols first.<br>A fraction bar also groups its top and bottom.</p>"],["2 · INDICES","<p>Then evaluate powers and roots.<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>4</mn><mn>2</mn></msup><mo>=</mo><mn>16</mn></mrow></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>25</mn></mrow></msqrt><mo>=</mo><mn>5</mn></mrow></math>.</p>"],["3 · DIVISION AND MULTIPLICATION","<p>These have <strong>equal priority</s .</p>"],["READ THE ENTIRE ENTRY","<p>Look at the expression before pressing =.<br>Estimate a sensible answer.<br>Keep full precision until the final rounding.</p>"]],"roots":[["ROOT OVER THE WHOLE SUM","<div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R</mi><mo>=</mo><msqrt><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></msqrt></mrow></math></div><p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>=</mo><mn>9</mn></mrow></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b</mi><mo>=</mo><mn>16</mn></mrow></math>:</p><div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R</mi><mo>=</mo><msqrt><mrow><mn>9</mn><mo>+</mo><mn>16</mn></mrow></msqrt><mo>=</mo><mn>5</mn></mrow></math></div><div class=\"key-entry\">sqrt(9 + 16)</div>"],["ADDITION OUTSIDE THE ROOT","<div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>=</mo><msqrt><mrow><mi>a</mi></mrow></msqrt><mo>+</mo><mi>b</mi></mrow></math></div><p>For the same values:</p><div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>=</mo><msqrt><mrow><mn>9</mn></mrow></msqrt><mo>+</mo><mn>16</mn><mo>=</mo><mn>19</mn></mrow></math></div><div class=\"key-entry\">sqrt(9) + 16</div>"]]},"demos":{"replace":[{"label":"n = 5","prompt":"A badge order costs £4 per badge plus a £3 setup fee.<br>Use <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mn>4</mn><mi>n</mi><mo>+</mo><mn>3</mn></mrow></math> for <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>5</mn></mrow></math>.<br>Find the cost <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi></mrow></math> in pounds.","values":[["n","5"]],"frames":[["Start wi function schedule(){let t=0;return LESSON.map(s=>{const o={...s,start:t,end:t+s.mins};t+=s.mins;return o;});}
function phases(){const out=[];for(const s of schedule()){let g=out.at(-1);if(!g||g.phase!==s.phase){g={phase:s.phase,start:s.start,end:s.end,first:s.n,last:s.n};out.push(g);}else{g.end=s.end;g.last=s.n;}}return out;}
function openModal(name){if(locked)return;if(!$('#whiteboardOverlay').hidden)whiteboard(false);if(!modalName)previousFocus=document.activeElement;modalName=name;setBackgroundInert(true);$('#modalLayer').hidden=false;$('#modalDialog').classList.toggle('compact',['timer','display','calculator'].includes(name));$('#modalTitle').textContent=({plan:'90-minute lesson plan',slides:'Choose a slide',notes:'Teacher notes',display:'Display preferences',timer:'Classroom timer',tools:'Classroom tools',calculator:'Classroom calculator'})[name]||'Classroom tools';$('#modalSubtitle').textContent=name==='notes'?'These notes may show answers on the projector.':'The lesson stays open behind this panel.';({plan:renderPlan,slides:renderMenu,notes:renderNotes,display:renderDisplay,timer:renderTimer,tools:renderTools,calculator:renderCalculator}[name]||renderTools)();$('#modalBody').scrollTop=0;$('#modalClose').focus({preventScroll:true});}
function closeModal(){if(!modalName)return;modalName=null;$('#modalLayer').hidden=true;setBackgroundInert(false);if(previousFocus?.isConnected&&previousFocus.getClientRects().length)previousFocus.focus({preventScroll:true});else $('#stage').focus({preventScroll:true});}

function answerHTML(q,label,withGuide=true){return '<article class="teacher-answer"><div class="q-label">'+esc(label)+'</div><div>'+q.prompt+'</div>'+source(q)+'<p class="answer-head"><strong>Answer:</strong> '+q.answer+'</p><div class="compact-steps">'+q.steps.map(st=>'<p><b>'+esc(st.label)+'</b></p>'+st.body).join('')+'</div>'+(withGuide&&q.source?'<div class="marking-note">'+esc(q.source.guidance)+'<br><a href="'+esc(q.source.scheme)+'">Mark scheme ↗</a></div>':'')+'</article>';}
function renderNotes(){const s=schedule()[current];let out='<p class="note-warning">Teacher notes may reveal answers on this screen.</p><h3>'+s.n+'. '+esc(s.title)+'</h3><p>'+s.start+'–'+s.end+' minutes.</p><div class="notes-block"><strong>Teach, ask and check</strong><p>'+esc(s.notes)+'</p></div>';if(s.question)out+=answerHTML(s.question,'Worked example');if(s.questions)out+=s.questions.map((q,i)=>answerHTML(q,s.examStart?'Question '+(s.examStart+i):s.examReview?'Question '+(i+1):String.fromCharCode(65+i))).join('');if(s.kind==='copy')out+=DATA.notes[s.key].map(([t,b])=>'<div class="notes-block"><strong>'+t+'</strong>'+b+'</div>').join('');if(s.kind==='activity')out+=activityKey();if(s.kind==='demo')out+=DATA.demos[s.key].map(c=>'<div class="notes-block"><strong>'+esc(c.label)+'</strong><p>'+c.prompt+'</p>'+c.frames.slice(1).map(f=>'<p><b>'+esc(f[0])+'</b></p>'+f[1]+'<p>'+esc(f[2])+'</p>').join('')+'</div>').join('');if(s.kind==='table')out+='<div class="notes-block">Answer row: −5, −3, −1, 1, 3.</div>';out+='<div class="notes-block"><strong>Support</strong><p>'+esc(s.support)+'</p><strong>Stretch</strong><p>'+esc(s.stretch)+'</p></div><div class="button-row">'+B('← Previous notes','data-notes-move="-1" '+(current===0?'disabled':''))+B('Next notes →','data-notes-move="1" '+(current===LESSON.length-1?'disabled':''))+'</div>';$('#modalBody').innerHTML=out;}

function sourceHTML(){return '<div class="sources"><h3>Sources and scope</h3><p>Four starter parts and eight main exam parts come from genuine Eduqas Foundation papers. Formulae, numerical inputs, answer demands and marks were checked against the original papers and schemes. Wording is rephrased for readability; these are not photographic copies. The remaining notes, demonstrations, examples, practice and individual activity are original classroom material. This independent resource is not endorsed by Eduqas.</p>'+DATA.sources.map(x=>'<div class="source-list-item"><p><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.label)+' ↗</a></p><p>'+esc(x.detail)+'</p>'+(x.scheme?'<p><a href="'+esc(x.scheme)+'" target="_blank" rel="noopener noreferrer">Awarding-body mark scheme ↗</a></p>':'')+'</div>').join('')+'<p>Selected source set, not a statistical claim about question frequency. Some awarding-body PDFs are served by Physics &amp; Maths Tutor. All teaching works offline; only external paper/activity-site links need an internet connection.</p></div>';}
function planSummary(){return '<div class="plan-summary"><strong>32 slides · 90-minute teaching plan</strong><p>Substitute numerical values into expressions and formulae; preserve brackets, powers and signs; use BIDMAS and a calculator; include word formulae, tables, grouped fractions, roots and a scientific formula.</p></div>'+timetable()+'<h3>Prepare</h3><p>Exercise books, pens and scientific calculators. The built-in offline calculator is available through Calculator/Tools as a classroom fallback. Its expression syntax is explained on screen; it is not a replica of any particular model. Students do written working on paper.</p><h3>Teaching sequence</h3><p>Starter retrieval, then positive substitution and notation. Introduce four priority levels, then signed values. Move into tables, calculators, fraction bars, roots and the supplied scientific formula. Examples begin with the question only. Solutions are separately revealed one step at a time. The copy notes provide a short reference.</p><h3>Timing and differentiation</h3><p>This is a planned 90 minutes, not an automatic timer. Review the questions that need discussion rather than reading every solution. Starter C and D revisit harder Foundation algebra; learners can begin with A and B. Split after slide 18 when the class needs longer. Early finishers explain why an alternative calculator entry is wrong.</p><h3>Past papers</h3><p>Slide 2 has four genuine expanding/factorising starter parts (7 marks). Slides 27 and 28 each contain four genuine main-topic parts (7 and 8 marks). The first main set is non-calculator; the second is calculator. Slide 29 gives selected worked review. Every part has an original paper and mark-scheme link. This sample is formative, not a predicted grade.</p><h3>Individual activity · Screen Test</h3><p>Slide 30 briefs the task. Slide 31 allows eight minutes: around six to judge six paired entries, then two to compare the most common errors. Each learner records A–F, the correct screen number, the correct value and one reason the other entry fails. The Check judgement button confirms a choice but does not reveal the numerical answer. Reveal explanation is separate. Reset activity clears only these decisions, not the timer or slide.</p><h3>Exit and classroom tools</h3><p>Slide 32 is independent: answers 18, 18, 9 and 5. Write keeps the selected question, not its answer, above a blank surface for Smart Board annotations. Close restores the exact slide state. Fullscreen, Focus, arrow navigation, display preferences, calculator and timers are retained. Timers never change slides or reveal answers. Password bcg123 and source-shortcut blocks are local deterrents, not encryption.</p>';}

// A deliberately small expression parser; no eval, no network, no arbitrary code.
const calcState={input:'',answer:null,error:''};
function calculateExpression(raw){
 const text=String(raw).replace(/×/g,'*').replace(/[−–]/g,'-').replace(/÷/g,'/').replace(/\s/g,'');
 if(!text||text.length>160)throw new Error('Enter a calculation, up to 160 characters.');
 const tokens=text.match(/sqrt|(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|[+\-*/^()]/g)||[];
 if(tokens.join('')!==text)throw new Error('Use numbers, brackets, +, −, ×, ÷, powers and sqrt.');
 let pos=0,depth=0;
 const read=t=>tokens[pos]===t?(pos++,true):false;
 function expression(){let v=term();while(tokens[pos]==='+'||tokens[pos]==='-'){const op=tokens[pos++],b=term();v=op==='+'?v+b:v-b;}return v;}
 function term(){let v=unary();while(tokens[pos]==='*'||tokens[pos]==='/'){const op=tokens[pos++],b=unary();if(op==='/'&&b===0)throw new Error('Division by zero is not defined.');v=op==='*'?v*b:v/b;}return v;}
 function unary(){if(++depth>32)throw new Error('This entry has too many nested operations.');let v;if(read('+'))v=unary();else if(read('-'))v=-unary();else v=power();depth--;return v;}
 function power(){let v=atom();if(read('^'))v=Math.pow(v,unary());return v;}
 function atom(){if(read('sqrt')){if(!read('('))throw new Error('Use sqrt( ... ) with brackets.');const v=expression();if(!read(')'))throw new Error('Close the square-root bracket.');if(v<0)throw new Error('This square root has no real-number value.');return Math.sqrt(v);}if(read('(')){const v=expression();if(!read(')'))throw new Error('Close the bracket.');return v;}const t=tokens[pos++];if(!t||! /^(?:\d|\.)/.test(t))throw new Error('A number is missing.');return Number(t);}
 const answer=expression();if(pos!==tokens.length)throw new Error('Check brackets and include × between factors.');if(!Number.isFinite(answer))throw new Error('The result is outside this calculator’s finite range.');return Object.is(answer,-0)?0:answer;
}
function formatCalc(n){return Number(n.toPrecision(14)).toString();}
function renderCalculator(){const keys=[['(', '('],[')', ')'],['^2','x²'],['sqrt(','√'],['7','7'],['8','8'],['9','9'],['÷','÷'],['4','4'],['5','5'],['6','6'],['×','×'],['1','1'],['2','2'],['3','3'],['−','−'],['0','0'],['.','.'],['^','^'],['+','+']];$('#modalBody').innerHTML='<form id="calculatorForm"><label class="setting-title" for="calculatorInput">Calculator entry</label><input id="calculatorInput" type="text" autocomplete="off" spellcheck="false" maxlength="160" value="'+esc(calcState.input)+'" placeholder="e.g. (3 × 4 + 6) ÷ (4 − 1)"><div class="calculator-answer" id="calculatorAnswer" role="status">'+esc(calcState.error||(calcState.answer===null?'Enter a calculation.':formatCalc(calcState.answer)))+'</div><div class="calculator-keys">'+keys.map(([v,l])=>'<button type="button" data-calc-key="'+esc(v)+'">'+l+'</button>').join('')+'</div><div class="calculator-actions"><button type="button" data-calc-clear>Clear</button><button type="button" data-calc-delete>⌫ Delete</button><button class="primary" type="submit">= Calculate</button></div></form><p class="setting-hint">Keypad keys append at the end; Delete removes the last character. Tap the entry to edit with your keyboard.<br>Use × explicitly. Close every bracket. sqrt(…) means square root; ^ means a power.<br>For a negative input use brackets, for example (−3)^2.<br>The display is rounded to 14 significant digits. Keep full working and apply the question’s final rounding.</p>';
 const f=$('#calculatorInput');f.addEventListener('input',()=>{calcState.input=f.value;calcState.error='';calcState.answer=null;$('#calculatorAnswer').textContent='Entry changed. Press Calculate.';});$('#calculatorForm').addEventListener('submit',e=>{e.preventDefault();runCalculator();});}
function runCalculator(){calcState.input=$('#calculatorInput').value;try{calcState.answer=calculateExpression(calcState.input);calcState.error='';}catch(e){calcState.answer=null;calcState.error=e.message;}$('#calculatorAnswer').textContent=calcState.error||formatCalc(calcState.answer);}
function editCalc(key){const f=$('#calculatorInput');if(key==='clear')f.value='';else if(key==='delete')f.value=f.value.slice(0,-1);else{if(f.value.length+key.length>160)return;f.value+=key;}calcState.input=f.value;calcState.answer=null;calcState.error='';f.setSelectionRange(f.value.length,f.value.length);$('#calculatorAnswer').textContent='Entry changed. Press Calculate.';}
